name: publish methods paper

on:
  push:
    tags: ["paper-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: make -C paper data
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/downstream.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - uses: actions/upload-artifact@v4
        with:
          name: downstream-methods-paper-${{ github.sha }}
          path: |
            paper/downstream.pdf
            docs/methods.html
          if-no-files-found: error
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            paper/downstream.pdf
            docs/methods.html
          name: Downstream methods paper ${{ github.ref_name }}
          generate_release_notes: true
