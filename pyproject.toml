[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream"
version = "0.3.0"
description = "Citation-calibrated microsimulation of displacement consequences"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.6.1,<2",
  "coverage[toml]>=7.16.2,<8",
  "hypothesis>=6.168.3,<7",
  "mutmut>=3.8.0,<4",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.10,<1",
  "vulture>=2.16,<3",
]

[project.scripts]
downstream = "downstream.cli:main"

[tool.setuptools]
packages = ["downstream", "downstream_data.params", "downstream_data.validation"]
include-package-data = false

[tool.setuptools.package-dir]
downstream = "src/downstream"
"downstream_data.params" = "params"
"downstream_data.validation" = "validation"

[tool.setuptools.package-data]
"downstream_data.params" = ["*"]
"downstream_data.validation" = ["*.csv", "*.json", "*.xml", "*.txt"]

[tool.pytest.ini_options]
addopts = "--ignore=mutants"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing the package.
"scripts/build_county_mortality.py" = ["E402"]
# The vulture whitelist references names it deliberately does not define.
"scripts/vulture_whitelist.py" = ["F821"]

[tool.coverage.run]
branch = true
source = ["downstream"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.vulture]
min_confidence = 60
# The whitelist is scanned alongside the code: its name references mark
# intentionally-unused API as used (see scripts/vulture_whitelist.py).
paths = ["src", "scripts", "scripts/vulture_whitelist.py"]

[tool.mutmut]
source_paths = [
  "src/downstream/mortality.py",
  "src/downstream/ledger.py",
  "src/downstream/scenario.py",
  "src/downstream/place.py",
  "src/downstream/validate.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_mathematics_v02.py",
  "tests/test_properties_hypothesis.py",
  "tests/test_ledger.py",
  "tests/test_place.py",
  "tests/test_v2_backtest.py",
]
mutate_only_covered_lines = true
also_copy = ["src/downstream", "params", "validation"]
