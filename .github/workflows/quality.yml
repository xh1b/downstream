name: quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# A new commit supersedes an older run for the same PR or branch.  This keeps
# the required checks current without consuming runners on obsolete commits.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src scripts
      # Dead-code gate: unused functions/classes/attributes fail the build.
      # Intentional API surface is reviewed in scripts/vulture_whitelist.py.
      - run: python -m vulture

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      # The Hypothesis property/state-machine tests take about three seconds
      # locally, so they are intentional PR/push gates rather than a nightly
      # only suite.  Mutation testing remains the expensive generative check.
      - run: >-
          python -m pytest -q
          tests/test_mathematics_v02.py tests/test_properties_hypothesis.py
          tests/test_ledger.py tests/test_place.py tests/test_build_places_adversarial.py
          tests/test_v2_backtest.py tests/test_forecast_fsm.py tests/test_bundle_fsm.py
          tests/test_compare.py

  distribution:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2'
      # Builds the wheel from the sdist, testing both distribution formats.
      - run: python -m build
      - shell: bash
        run: python scripts/check_distribution.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m coverage run -m pytest
      - run: python -m coverage json -o coverage.json
      - run: python scripts/quality_gate.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 14

  mutation-and-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m mutmut run --max-children 4
      - run: python -m mutmut results --all true | tee mutmut-results.txt
      - run: python scripts/benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-and-benchmark-${{ github.run_id }}
          path: |
            mutmut-results.txt
            mutants/
          if-no-files-found: ignore
          retention-days: 30
