[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream"
version = "0.1.0"
description = "Citation-calibrated microsimulation of displacement consequences"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
downstream = "downstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
